[project]
name = "debt-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kij1n", email = "kij1n@proton.me" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "types-psycopg2>=2.9.21.20260724",
]

[project.scripts]
debt-api = "debt_api:main"

[tool.fastapi]
entrypoint = "debt_api.main:app"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
